<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChromaTouch — Finger Color Studio</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #09090f;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }
    #canvas-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
      display: block;
    }
    .glass-panel {
      background: rgba(15, 17, 26, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .hint-pulse {
      animation: pulseGlow 2.8s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <canvas id="canvas-stage"></canvas>

  <!-- Top HUD: Color Readout & Quick Actions -->
  <header class="fixed top-3 left-3 right-3 z-20 flex items-center justify-between gap-2 pointer-events-none">
    <div class="glass-panel pointer-events-auto flex items-center gap-2.5 px-3 py-2 rounded-2xl">
      <div id="active-swatch" class="w-6 h-6 rounded-full border border-white/30 shadow-inner transition-colors duration-150" style="background: hsl(200, 95%, 60%);"></div>
      <div class="leading-tight">
        <div class="text-xs font-semibold tracking-wide text-white/95">ChromaTouch</div>
        <div id="color-readout" class="text-[11px] font-mono text-slate-300">#38BDF8 · Touch to paint</div>
      </div>
    </div>

    <div class="glass-panel pointer-events-auto flex items-center gap-1.5 px-2 py-1.5 rounded-2xl">
      <button id="btn-sound" type="button" title="Toggle Touch Chimes" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-200 hover:bg-white/10 active:scale-95 transition">
        <svg id="icon-sound-off" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        <svg id="icon-sound-on" class="w-4 h-4 hidden text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        <span class="hidden sm:inline" id="sound-label">Sound Off</span>
      </button>

      <button id="btn-fade" type="button" title="Toggle Auto-Fade" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium bg-indigo-500/25 text-indigo-200 border border-indigo-400/30 hover:bg-indigo-500/35 active:scale-95 transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"></path><path d="M12 18v4"></path><path d="M4.93 4.93l2.83 2.83"></path><path d="M16.24 16.24l2.83 2.83"></path><path d="M2 12h4"></path><path d="M18 12h4"></path></svg>
        <span class="hidden sm:inline" id="fade-label">Fade On</span>
      </button>

      <button id="btn-save" type="button" title="Save Artwork as PNG" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-200 hover:bg-white/10 active:scale-95 transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span class="hidden sm:inline">Save</span>
      </button>

      <button id="btn-clear" type="button" title="Clear Canvas" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium text-rose-200 hover:bg-rose-500/20 active:scale-95 transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
        <span class="hidden sm:inline">Clear</span>
      </button>

      <button id="btn-toggle-hud" type="button" title="Hide/Show Controls" class="p-1.5 rounded-xl text-slate-300 hover:bg-white/10 active:scale-95 transition">
        <svg id="icon-chevron-down" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        <svg id="icon-chevron-up" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
      </button>
    </div>
  </header>

  <!-- Center Onboarding Hint (fades away on first touch) -->
  <div id="onboarding-hint" class="fixed inset-0 z-10 flex items-center justify-center pointer-events-none transition-opacity duration-700">
    <div class="hint-pulse glass-panel px-5 py-3.5 rounded-2xl text-center max-w-xs mx-4">
      <div class="text-sm font-semibold text-white">Tap, drag, or use multiple fingers</div>
      <div class="text-xs text-slate-300 mt-1">Speed, position &amp; multi-touch generate living colors</div>
    </div>
  </div>

  <!-- Toast Feedback -->
  <div id="toast-msg" class="fixed top-16 left-1/2 -translate-x-1/2 z-30 glass-panel px-4 py-2 rounded-full text-xs font-medium text-white opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <!-- Bottom Controls Dock -->
  <footer id="bottom-dock" class="fixed bottom-3 left-3 right-3 z-20 flex justify-center pointer-events-none transition-all duration-300">
    <div class="glass-panel pointer-events-auto w-full max-w-2xl rounded-2xl p-2.5 flex flex-col gap-2">
      <!-- Mode Selector -->
      <div class="flex items-center justify-between gap-2">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 pl-1 shrink-0">Brush</span>
        <div id="mode-buttons" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          <button type="button" data-mode="ripple" class="mode-btn px-3 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap bg-white text-slate-900 shadow">Ripple Bloom</button>
          <button type="button" data-mode="ribbon" class="mode-btn px-3 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap text-slate-300 hover:bg-white/10">Fluid Ribbon</button>
          <button type="button" data-mode="kaleidoscope" class="mode-btn px-3 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap text-slate-300 hover:bg-white/10">Kaleidoscope</button>
          <button type="button" data-mode="splash" class="mode-btn px-3 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap text-slate-300 hover:bg-white/10">Color Splash</button>
        </div>
      </div>

      <!-- Palette Selector -->
      <div class="flex items-center justify-between gap-2 border-t border-white/10 pt-2">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 pl-1 shrink-0">Palette</span>
        <div id="palette-buttons" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          <button type="button" data-palette="spectrum" class="palette-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap bg-white/15 text-white border border-white/25">
            <span class="w-3 h-3 rounded-full" style="background: conic-gradient(#f43f5e, #f59e0b, #10b981, #3b82f6, #a855f7, #f43f5e);"></span>
            Spectrum
          </button>
          <button type="button" data-palette="neon" class="palette-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap text-slate-300 hover:bg-white/10 border border-transparent">
            <span class="w-3 h-3 rounded-full" style="background: linear-gradient(135deg, #ff00cc, #00f5d4);"></span>
            Neon
          </button>
          <button type="button" data-palette="sunset" class="palette-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap text-slate-300 hover:bg-white/10 border border-transparent">
            <span class="w-3 h-3 rounded-full" style="background: linear-gradient(135deg, #ff4d6d, #ffb703);"></span>
            Sunset
          </button>
          <button type="button" data-palette="ocean" class="palette-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap text-slate-300 hover:bg-white/10 border border-transparent">
            <span class="w-3 h-3 rounded-full" style="background: linear-gradient(135deg, #06d6a0, #3a86ff);"></span>
            Ocean
          </button>
          <button type="button" data-palette="pastel" class="palette-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap text-slate-300 hover:bg-white/10 border border-transparent">
            <span class="w-3 h-3 rounded-full" style="background: linear-gradient(135deg, #fbcfe8, #a5f3fc);"></span>
            Pastel
          </button>
        </div>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      const canvas = document.getElementById('canvas-stage');
      const ctx = canvas.getContext('2d');

      const activeSwatch = document.getElementById('active-swatch');
      const colorReadout = document.getElementById('color-readout');
      const onboardingHint = document.getElementById('onboarding-hint');
      const toastMsg = document.getElementById('toast-msg');
      const bottomDock = document.getElementById('bottom-dock');

      const btnSound = document.getElementById('btn-sound');
      const iconSoundOff = document.getElementById('icon-sound-off');
      const iconSoundOn = document.getElementById('icon-sound-on');
      const soundLabel = document.getElementById('sound-label');

      const btnFade = document.getElementById('btn-fade');
      const fadeLabel = document.getElementById('fade-label');
      const btnSave = document.getElementById('btn-save');
      const btnClear = document.getElementById('btn-clear');
      const btnToggleHud = document.getElementById('btn-toggle-hud');
      const iconChevronDown = document.getElementById('icon-chevron-down');
      const iconChevronUp = document.getElementById('icon-chevron-up');

      const modeButtons = document.querySelectorAll('.mode-btn');
      const paletteButtons = document.querySelectorAll('.palette-btn');

      const PALETTES = {
        spectrum: null,
        neon: [315, 185, 270, 145, 340],
        sunset: [350, 15, 35, 325, 48],
        ocean: [175, 205, 230, 160, 255],
        pastel: [330, 195, 275, 150, 25]
      };

      const state = {
        mode: 'ripple',
        palette: 'spectrum',
        fadeEnabled: true,
        soundEnabled: false,
        hudVisible: true,
        hasInteracted: false,
        globalHue: 200,
        width: 0,
        height: 0,
        dpr: 1,
        pointers: new Map(),
        ripples: [],
        particles: [],
        animFrameId: null,
        toastTimer: null,
        audioCtx: null,
        lastChimeTime: 0
      };

      function showToast(text) {
        toastMsg.textContent = text;
        toastMsg.classList.remove('opacity-0');
        toastMsg.classList.add('opacity-100');
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => {
          toastMsg.classList.remove('opacity-100');
          toastMsg.classList.add('opacity-0');
        }, 1800);
      }

      function hslToHex(h, s, l) {
        s /= 100;
        l /= 100;
        const k = n => (n + h / 30) % 12;
        const a = s * Math.min(l, 1 - l);
        const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        const toHex = x => Math.round(255 * f(x)).toString(16).padStart(2, '0').toUpperCase();
        return `#${toHex(0)}${toHex(8)}${toHex(4)}`;
      }

      function pickColor(pointerId, x, y, speed) {
        const sat = state.palette === 'pastel' ? 78 : 95;
        const light = state.palette === 'pastel' ? 76 : 60;
        let hue;

        if (state.palette === 'spectrum') {
          const posShift = ((x / Math.max(1, state.width)) * 140 + (y / Math.max(1, state.height)) * 80);
          hue = (state.globalHue + posShift + (pointerId * 47) + speed * 0.6) % 360;
        } else {
          const hues = PALETTES[state.palette];
          const idx = Math.abs(Math.floor((x / Math.max(1, state.width)) * hues.length + pointerId + (state.globalHue / 70))) % hues.length;
          hue = (hues[idx] + Math.sin(state.globalHue * 0.05) * 14 + speed * 0.25 + 360) % 360;
        }

        const css = `hsl(${Math.round(hue)}, ${sat}%, ${light}%)`;
        const hex = hslToHex(hue, sat, light);
        return { hue, sat, light, css, hex };
      }

      function updateColorHUD(colorObj, activeCount) {
        activeSwatch.style.background = colorObj.css;
        const touchText = activeCount > 1 ? ` · ${activeCount} fingers` : '';
        colorReadout.textContent = `${colorObj.hex} · HSL(${Math.round(colorObj.hue)}°, ${colorObj.sat}%, ${colorObj.light}%)${touchText}`;
      }

      function playChime(yNorm) {
        if (!state.soundEnabled) return;
        const nowMs = performance.now();
        if (nowMs - state.lastChimeTime < 75) return;
        state.lastChimeTime = nowMs;

        try {
          if (!state.audioCtx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            state.audioCtx = new AudioCtx();
          }
          if (state.audioCtx.state === 'suspended') {
            state.audioCtx.resume();
          }

          const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
          const idx = Math.max(0, Math.min(pentatonic.length - 1, Math.floor((1 - yNorm) * pentatonic.length)));
          const freq = pentatonic[idx];

          const osc = state.audioCtx.createOscillator();
          const gain = state.audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, state.audioCtx.currentTime);

          gain.gain.setValueAtTime(0.001, state.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.08, state.audioCtx.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, state.audioCtx.currentTime + 0.42);

          osc.connect(gain);
          gain.connect(state.audioCtx.destination);
          osc.start();
          osc.stop(state.audioCtx.currentTime + 0.45);
        } catch (_) {
          // Ignore audio errors if blocked
        }
      }

      function spawnRipple(x, y, colorObj, radiusMax) {
        state.ripples.push({
          x,
          y,
          r: 6,
          maxR: radiusMax || (55 + Math.random() * 55),
          alpha: 0.9,
          hue: colorObj.hue,
          sat: colorObj.sat,
          light: colorObj.light,
          lineWidth: 3 + Math.random() * 2.5
        });
      }

      function spawnParticles(x, y, colorObj, count, speedScale) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const vel = (0.8 + Math.random() * 3.8) * (speedScale || 1);
          state.particles.push({
            x,
            y,
            vx: Math.cos(angle) * vel,
            vy: Math.sin(angle) * vel,
            size: 2.5 + Math.random() * 5.5,
            alpha: 1,
            decay: 0.015 + Math.random() * 0.02,
            hue: (colorObj.hue + (Math.random() * 26 - 13) + 360) % 360,
            sat: colorObj.sat,
            light: colorObj.light
          });
        }
        if (state.particles.length > 900) {
          state.particles.splice(0, state.particles.length - 900);
        }
      }

      function drawStrokeSegment(x1, y1, x2, y2, colorObj, width) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = colorObj.css;
        ctx.shadowColor = colorObj.css;
        ctx.shadowBlur = 16;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
      }

      function drawKaleidoscopeSegment(x1, y1, x2, y2, colorObj, width) {
        const cx = state.width / 2;
        const cy = state.height / 2;
        const slices = 8;
        const step = (Math.PI * 2) / slices;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = colorObj.css;
        ctx.shadowColor = colorObj.css;
        ctx.shadowBlur = 14;
        ctx.lineWidth = width;

        for (let i = 0; i < slices; i++) {
          ctx.save();
          ctx.rotate(i * step);
          ctx.beginPath();
          ctx.moveTo(x1 - cx, y1 - cy);
          ctx.lineTo(x2 - cx, y2 - cy);
          ctx.stroke();

          ctx.scale(1, -1);
          ctx.beginPath();
          ctx.moveTo(x1 - cx, y1 - cy);
          ctx.lineTo(x2 - cx, y2 - cy);
          ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
      }

      function markInteracted() {
        if (!state.hasInteracted) {
          state.hasInteracted = true;
          onboardingHint.classList.add('opacity-0');
          setTimeout(() => {
            onboardingHint.style.display = 'none';
          }, 700);
        }
      }

      function onPointerDown(e) {
        e.preventDefault();
        markInteracted();
        canvas.setPointerCapture(e.pointerId);

        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const colorObj = pickColor(e.pointerId, x, y, 0);

        state.pointers.set(e.pointerId, { x, y, lastColor: colorObj });
        updateColorHUD(colorObj, state.pointers.size);
        playChime(y / Math.max(1, state.height));

        if (state.mode === 'ripple') {
          spawnRipple(x, y, colorObj, 95);
          spawnParticles(x, y, colorObj, 10, 1.1);
        } else if (state.mode === 'ribbon') {
          spawnParticles(x, y, colorObj, 6, 0.7);
          drawStrokeSegment(x, y, x + 0.5, y + 0.5, colorObj, 14);
        } else if (state.mode === 'kaleidoscope') {
          drawKaleidoscopeSegment(x, y, x + 0.5, y + 0.5, colorObj, 6);
        } else if (state.mode === 'splash') {
          spawnParticles(x, y, colorObj, 26, 1.8);
          spawnRipple(x, y, colorObj, 65);
        }
      }

      function onPointerMove(e) {
        if (!state.pointers.has(e.pointerId)) return;
        e.preventDefault();

        const ptr = state.pointers.get(e.pointerId);
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const dx = x - ptr.x;
        const dy = y - ptr.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 1.5) return;

        const colorObj = pickColor(e.pointerId, x, y, dist);
        updateColorHUD(colorObj, state.pointers.size);
        if (dist > 14) {
          playChime(y / Math.max(1, state.height));
        }

        if (state.mode === 'ripple') {
          drawStrokeSegment(ptr.x, ptr.y, x, y, colorObj, Math.min(18, 6 + dist * 0.2));
          if (dist > 8) {
            spawnRipple(x, y, colorObj, 50 + Math.min(60, dist * 1.4));
            spawnParticles(x, y, colorObj, 3, 0.8);
          }
        } else if (state.mode === 'ribbon') {
          const strokeW = Math.max(6, Math.min(28, 24 - dist * 0.25));
          drawStrokeSegment(ptr.x, ptr.y, x, y, colorObj, strokeW);
          spawnParticles(x, y, colorObj, 2, 0.6);
        } else if (state.mode === 'kaleidoscope') {
          const strokeW = Math.max(3, Math.min(12, 4 + dist * 0.12));
          drawKaleidoscopeSegment(ptr.x, ptr.y, x, y, colorObj, strokeW);
        } else if (state.mode === 'splash') {
          const count = Math.min(18, 4 + Math.floor(dist * 0.45));
          spawnParticles(x, y, colorObj, count, 1 + Math.min(1.8, dist * 0.04));
        }

        ptr.x = x;
        ptr.y = y;
        ptr.lastColor = colorObj;
      }

      function onPointerUp(e) {
        state.pointers.delete(e.pointerId);
      }

      function resizeCanvas() {
        const prevW = canvas.width;
        const prevH = canvas.height;
        let snapshot = null;
        if (prevW > 0 && prevH > 0) {
          snapshot = document.createElement('canvas');
          snapshot.width = prevW;
          snapshot.height = prevH;
          snapshot.getContext('2d').drawImage(canvas, 0, 0);
        }

        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

        ctx.fillStyle = '#09090f';
        ctx.fillRect(0, 0, state.width, state.height);
        if (snapshot) {
          ctx.drawImage(snapshot, 0, 0, state.width, state.height);
        }
      }

      function seedInitialBloom() {
        const cx = state.width / 2;
        const cy = state.height / 2;
        const c1 = { hue: 205, sat: 95, light: 60 };
        const c2 = { hue: 315, sat: 95, light: 60 };
        spawnRipple(cx - 45, cy - 10, c1, 130);
        spawnRipple(cx + 45, cy + 10, c2, 110);
        spawnParticles(cx, cy, c1, 18, 1.2);
      }

      function tick() {
        state.globalHue = (state.globalHue + 0.45) % 360;

        if (state.fadeEnabled) {
          ctx.fillStyle = 'rgba(9, 9, 15, 0.045)';
          ctx.fillRect(0, 0, state.width, state.height);
        }

        // Update and draw ripples
        for (let i = state.ripples.length - 1; i >= 0; i--) {
          const rp = state.ripples[i];
          rp.r += (rp.maxR - rp.r) * 0.08 + 1.1;
          rp.alpha -= 0.018;

          if (rp.alpha <= 0.01) {
            state.ripples.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.strokeStyle = `hsla(${Math.round(rp.hue)}, ${rp.sat}%, ${rp.light}%, ${rp.alpha.toFixed(3)})`;
          ctx.shadowColor = `hsl(${Math.round(rp.hue)}, ${rp.sat}%, ${rp.light}%)`;
          ctx.shadowBlur = 14;
          ctx.lineWidth = rp.lineWidth;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Update and draw particles
        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.alpha -= p.decay;

          if (p.alpha <= 0.01) {
            state.particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.fillStyle = `hsla(${Math.round(p.hue)}, ${p.sat}%, ${p.light}%, ${p.alpha.toFixed(3)})`;
          ctx.shadowColor = `hsl(${Math.round(p.hue)}, ${p.sat}%, ${p.light}%)`;
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.alpha, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        state.animFrameId = requestAnimationFrame(tick);
      }

      // Wire UI Controls
      modeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          state.mode = btn.dataset.mode;
          modeButtons.forEach(b => {
            const active = b === btn;
            b.className = active
              ? 'mode-btn px-3 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap bg-white text-slate-900 shadow'
              : 'mode-btn px-3 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap text-slate-300 hover:bg-white/10';
          });
          showToast(`Brush: ${btn.textContent.trim()}`);
        });
      });

      paletteButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          state.palette = btn.dataset.palette;
          paletteButtons.forEach(b => {
            const active = b === btn;
            b.className = active
              ? 'palette-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap bg-white/15 text-white border border-white/25'
              : 'palette-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap text-slate-300 hover:bg-white/10 border border-transparent';
          });
          showToast(`Palette: ${btn.textContent.trim()}`);
        });
      });

      btnSound.addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        iconSoundOff.classList.toggle('hidden', state.soundEnabled);
        iconSoundOn.classList.toggle('hidden', !state.soundEnabled);
        soundLabel.textContent = state.soundEnabled ? 'Sound On' : 'Sound Off';
        if (state.soundEnabled) {
          playChime(0.5);
          showToast('Touch chimes enabled');
        } else {
          showToast('Touch chimes muted');
        }
      });

      btnFade.addEventListener('click', () => {
        state.fadeEnabled = !state.fadeEnabled;
        fadeLabel.textContent = state.fadeEnabled ? 'Fade On' : 'Persist';
        btnFade.className = state.fadeEnabled
          ? 'flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium bg-indigo-500/25 text-indigo-200 border border-indigo-400/30 hover:bg-indigo-500/35 active:scale-95 transition'
          : 'flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium bg-emerald-500/25 text-emerald-200 border border-emerald-400/30 hover:bg-emerald-500/35 active:scale-95 transition';
        showToast(state.fadeEnabled ? 'Auto-fade enabled' : 'Persistent paint mode');
      });

      btnClear.addEventListener('click', () => {
        state.ripples = [];
        state.particles = [];
        ctx.fillStyle = '#09090f';
        ctx.fillRect(0, 0, state.width, state.height);
        showToast('Canvas cleared');
      });

      btnSave.addEventListener('click', () => {
        try {
          const link = document.createElement('a');
          link.download = `chromatouch-${Date.now()}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          showToast('Saved artwork PNG');
        } catch (_) {
          showToast('Could not export image');
        }
      });

      btnToggleHud.addEventListener('click', () => {
        state.hudVisible = !state.hudVisible;
        bottomDock.classList.toggle('translate-y-28', !state.hudVisible);
        bottomDock.classList.toggle('opacity-0', !state.hudVisible);
        bottomDock.classList.toggle('pointer-events-none', !state.hudVisible);
        iconChevronDown.classList.toggle('hidden', !state.hudVisible);
        iconChevronUp.classList.toggle('hidden', state.hudVisible);
      });

      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('pointercancel', onPointerUp);

      window.addEventListener('resize', resizeCanvas);

      window.onload = function () {
        resizeCanvas();
        seedInitialBloom();
        if (state.animFrameId) cancelAnimationFrame(state.animFrameId);
        state.animFrameId = requestAnimationFrame(tick);
      };
    })();
  </script>
</body>
</html>
