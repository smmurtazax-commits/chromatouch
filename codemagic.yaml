workflows:
  android-workflow:
    name: ChromaTouch Android APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Generate Gradle wrapper
        script: |
          gradle wrapper --gradle-version 8.7
      - name: Build debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - sm.murtazax@gmail.com
        notify:
          success: true
          failure: true
